services:
  postgres:
    image: postgres:17-alpine
    container_name: pawmatch-postgres
    environment:
      POSTGRES_DB: pawmatch
      POSTGRES_USER: pawmatch
      POSTGRES_PASSWORD: pawmatch
    ports:
      - "5432:5432"
    volumes:
      - pawmatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawmatch -d pawmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pawmatch-pgdata:
