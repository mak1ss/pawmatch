databaseChangeLog:
  - changeSet:
      id: 003-create-questionnaire-session
      author: pawmatch
      comment: >
        One questionnaire attempt. Guest sessions are identified only by this unguessable id (UUIDv7, generated by the app).
        updated_at changes whenever a new answers version is stored. user_id is added in M8 (accounts).
      changes:
        - createTable:
            tableName: questionnaire_session
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_questionnaire_session}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}

  - changeSet:
      id: 003-create-questionnaire-answers
      author: pawmatch
      comment: >
        Versioned answers of a session. Every submit or resubmit stores a new row with version = previous + 1.
        answers holds the canonical snake_case answers; questionnaire_version says which question set produced them.
      changes:
        - createTable:
            tableName: questionnaire_answers
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_questionnaire_answers}}
              - column:
                  name: session_id
                  type: UUID
                  constraints: {nullable: false, foreignKeyName: fk_questionnaire_answers_session, references: questionnaire_session(id)}
              - column: {name: version, type: INTEGER, constraints: {nullable: false}}
              - column: {name: questionnaire_version, type: VARCHAR(16), constraints: {nullable: false}}
              - column: {name: answers, type: JSONB, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: {nullable: false}}
        - addUniqueConstraint:
            tableName: questionnaire_answers
            columnNames: session_id, version
            constraintName: uq_questionnaire_answers_session_version
        - sql:
            sql: >
              ALTER TABLE questionnaire_answers
                ADD CONSTRAINT ck_questionnaire_answers_version CHECK (version >= 1),
                ADD CONSTRAINT ck_questionnaire_answers_answers_object CHECK (jsonb_typeof(answers) = 'object');
