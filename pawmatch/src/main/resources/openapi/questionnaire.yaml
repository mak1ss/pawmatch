# OpenAPI components for the questionnaire endpoints, merged into the generated spec by OpenApiConfig.
# Controllers reference them by name, e.g. @RequestBody(ref = "#/components/requestBodies/QuestionnaireAnswers").
#
# Keep in sync with the code: QuestionnaireContract defines the fields, and tests fail if this schema or the examples
# drift from it (OpenApiQuestionnaireDocsTest).

schemas:
  QuestionnaireAnswers:
    type: object
    description: >
      Answers keyed by field key; the same contract is published at GET /api/v1/questionnaire.
      Use exact JSON types: true/false (not 1 or "true"), integers as integers (not "3" or 3.0).
      Unknown fields are rejected; every invalid field is reported at once in a 422 response.
    additionalProperties: false
    required:
      - activity_level
      - shedding_tolerance
      - grooming_capacity
      - mental_stimulation_capacity
      - barking_tolerance
      - preferred_size
      - has_young_children
      - has_other_dogs
      - has_cats
      - housing_type
      - walk_minutes_daily
      - alone_hours_daily
      - owner_experience
      - training_minutes_daily
    properties:
      activity_level:
        type: integer
        minimum: 1
        maximum: 5
        description: Desired activity level of the dog.
      shedding_tolerance:
        type: integer
        minimum: 1
        maximum: 5
        description: Acceptable shedding (5 = heavy shedding is fine).
      grooming_capacity:
        type: integer
        minimum: 1
        maximum: 5
        description: Capacity for coat care.
      mental_stimulation_capacity:
        type: integer
        minimum: 1
        maximum: 5
        description: Readiness for mental exercise and training.
      barking_tolerance:
        type: integer
        minimum: 1
        maximum: 5
        description: Acceptable barking.
      preferred_size:
        type: string
        enum: [XSmall, Small, Medium, Large, XLarge, any]
        description: Soft size preference.
      has_young_children:
        type: boolean
      has_other_dogs:
        type: boolean
      has_cats:
        type: boolean
      housing_type:
        type: string
        enum: [apartment, house, other]
      walk_minutes_daily:
        type: number
        minimum: 0
        maximum: 1440
        description: Minutes per day for walks; decimals allowed.
      alone_hours_daily:
        type: number
        minimum: 0
        maximum: 24
        description: Hours per day the dog is alone; decimals allowed.
      owner_experience:
        type: string
        enum: [none, some, experienced]
      training_minutes_daily:
        type: number
        minimum: 0
        maximum: 1440
        description: Minutes per day for training; decimals allowed.
      allowed_sizes:
        type: array
        minItems: 1
        uniqueItems: true
        description: Optional hard size filter. Breeds of other sizes are excluded.
        items:
          type: string
          enum: [XSmall, Small, Medium, Large, XLarge]
      hard_limits:
        type: object
        additionalProperties: false
        description: Optional maximum allowed breed ratings (1–5). Breeds above a limit are excluded.
        properties:
          energy_level: {type: integer, minimum: 1, maximum: 5}
          shedding_level: {type: integer, minimum: 1, maximum: 5}
          coat_grooming_frequency: {type: integer, minimum: 1, maximum: 5}
          mental_stimulation_needs: {type: integer, minimum: 1, maximum: 5}
          barking_level: {type: integer, minimum: 1, maximum: 5}

requestBodies:
  QuestionnaireAnswers:
    required: true
    description: The complete questionnaire answers.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/QuestionnaireAnswers'
        examples:
          required-only:
            $ref: '#/components/examples/AnswersRequiredOnly'
          with-constraints:
            $ref: '#/components/examples/AnswersWithConstraints'

examples:
  AnswersRequiredOnly:
    summary: All 14 required answers
    value:
      activity_level: 3
      shedding_tolerance: 2
      grooming_capacity: 2
      mental_stimulation_capacity: 3
      barking_tolerance: 2
      preferred_size: Small
      has_young_children: true
      has_other_dogs: false
      has_cats: false
      housing_type: apartment
      walk_minutes_daily: 60
      alone_hours_daily: 4
      owner_experience: none
      training_minutes_daily: 20
  AnswersWithConstraints:
    summary: Required answers plus the optional allowed_sizes and hard_limits
    value:
      activity_level: 4
      shedding_tolerance: 3
      grooming_capacity: 2
      mental_stimulation_capacity: 4
      barking_tolerance: 3
      preferred_size: Medium
      has_young_children: false
      has_other_dogs: true
      has_cats: true
      housing_type: house
      walk_minutes_daily: 90
      alone_hours_daily: 6.5
      owner_experience: some
      training_minutes_daily: 30
      allowed_sizes: [Small, Medium, Large]
      hard_limits:
        shedding_level: 3
        barking_level: 3
